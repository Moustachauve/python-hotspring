---
name: PR Labels

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-labels:
    name: PR Labels
    runs-on: ubuntu-latest
    steps:
      - name: 🏷️ Auto-label PR
        if: >-
          (github.event.action == 'opened' || github.event.action == 'reopened')
          && github.event.pull_request.labels.length == 0
        uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: false

      - name: 🚀 Verify Required Label
        uses: mheap/github-action-required-labels@v5
        with:
          mode: exactly
          count: 1
          labels: >
            breaking-change,
            bugfix,
            dependencies,
            documentation,
            enhancement,
            maintenance,
            new-feature
